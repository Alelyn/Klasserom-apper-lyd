<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4fafc">
  <meta name="description" content="HeliLogg Norge – registrering, analyse og konsesjonsoppfølging for helikopterbevegelser ved norske sykehus.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src https://vwynwwxqtkrnjqngluut.supabase.co; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
  <title>HeliLogg Norge</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4fafc;color:#102634}body{display:grid;place-items:center;padding:24px}.boot{width:min(540px,100%);text-align:center}.mark{width:62px;height:62px;border-radius:19px;background:linear-gradient(145deg,#087f98,#075e74);color:#fff;display:grid;place-items:center;margin:0 auto 18px;font-size:28px;font-weight:900;box-shadow:0 18px 42px rgba(8,127,152,.22)}h1{margin:0 0 8px;font-size:clamp(26px,6vw,35px);letter-spacing:-.035em}p{color:#5e7480;line-height:1.55;margin:0}.bar{height:7px;border-radius:999px;background:#dcebf0;overflow:hidden;margin:24px auto 12px;width:min(320px,80vw)}.bar:after{content:"";display:block;height:100%;width:42%;border-radius:inherit;background:#087f98;animation:load 1.05s ease-in-out infinite alternate}@keyframes load{to{transform:translateX(140%)}}.small{font-size:12px}.error{background:#fff;border:1px solid #d5e4e9;border-radius:20px;padding:26px;box-shadow:0 22px 70px rgba(16,38,52,.12)}.error strong{display:block;font-size:20px;margin-bottom:8px}.error button{border:0;border-radius:12px;background:#087f98;color:#fff;font:inherit;font-weight:760;padding:12px 18px;cursor:pointer;margin-top:16px}
  </style>
</head>
<body>
  <main id="boot" class="boot">
    <div class="mark">H</div>
    <h1>HeliLogg Norge</h1>
    <p>Laster sikker landingsside og arbeidsflate …</p>
    <div class="bar"></div>
    <p class="small">App-pakken kontrolleres før oppstart.</p>
  </main>
<script>
(async()=>{
  const endpoint='https://vwynwwxqtkrnjqngluut.supabase.co/functions/v1/helilogg-bundle-v151/payload';
  const compressedSha='330ec3d58bd338a5fc827465aae38226fe2d28bd4cd8e3ae870262f8fd82871b';
  const htmlSha='aa29b19bec572195ef17eca43de7a579fb9a55c725a04aef6e6e3e23a2492a5c';
  const root=document.getElementById('boot');
  const hex=buffer=>Array.from(new Uint8Array(buffer),byte=>byte.toString(16).padStart(2,'0')).join('');
  try{
    if(!crypto?.subtle||!('DecompressionStream' in window))throw new Error('Nettleseren må oppdateres før HeliLogg kan startes sikkert.');
    const response=await fetch(endpoint,{cache:'no-store'});
    if(!response.ok)throw new Error('Kunne ikke hente app-pakken.');
    const compressed=await response.arrayBuffer();
    if(hex(await crypto.subtle.digest('SHA-256',compressed))!==compressedSha)throw new Error('Integritetskontrollen av app-pakken feilet.');
    const stream=new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
    const htmlBytes=await new Response(stream).arrayBuffer();
    if(hex(await crypto.subtle.digest('SHA-256',htmlBytes))!==htmlSha)throw new Error('Integritetskontrollen av appen feilet.');
    let html=new TextDecoder().decode(htmlBytes);
    const routingMarker='const STATIC_OBJECT_HOST = /\\/storage\\/v1\\/object\\/public\\//.test(location.pathname);';
    if(!html.includes(routingMarker))throw new Error('Ruteoppsettet i app-pakken kunne ikke bekreftes.');
    html=html.replace(routingMarker,'const STATIC_OBJECT_HOST = true;');
    document.open();document.write(html);document.close();
  }catch(error){
    console.error(error);
    root.innerHTML='<div class="error"><strong>HeliLogg kunne ikke startes</strong><p>'+String(error?.message||error)+'</p><button type="button" onclick="location.reload()">Prøv igjen</button></div>';
  }
})();
</script>
</body>
</html>
